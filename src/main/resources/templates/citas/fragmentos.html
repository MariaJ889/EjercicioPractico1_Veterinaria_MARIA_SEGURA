<!DOCTYPE html>

<!-- Fragmento para mostrar listado de citas -->
<section th:fragment="listado" class="container py-4" xmlns:th="http://www.thymeleaf.org">
    <div class="card border-0 shadow-sm">
        <div class="card-header bg-dark text-white px-4 py-3">
            <h2 class="h4 mb-1">Citas programadas</h2>
            <p class="mb-0 text-white-50" th:text="|${totalCitas} citas registradas|">Citas registradas</p>
        </div>
        <div class="card-body p-3 p-md-4">
            <div class="table-responsive" th:if="${citas != null and !citas.empty}">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                    <tr>
                        <th class="text-primary">Mascota</th>
                        <th class="text-primary">Propietario</th>
                        <th class="text-primary">Fecha</th>
                        <th class="text-primary">Servicio</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="cita : ${citas}">
                        <td class="fw-semibold text-dark" th:text="${cita.nombreMascota}"></td>
                        <td th:text="${cita.nombrePropietario}"></td>
                        <td th:text="${#temporals.format(cita.fecha, 'dd/MM/yyyy')}"></td>
                        <td th:text="${cita.servicio.nombre}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <p class="text-secondary mb-0" th:if="${citas == null or citas.empty}">
                No hay citas programadas todavía.
            </p>
        </div>
    </div>
</section>
